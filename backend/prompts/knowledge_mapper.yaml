name: knowledge_mapper
version: "1.1"
description: Map question to predefined knowledge tree nodes
provider: mimo

system_prompt: |
  You are an educational knowledge mapper. Map the given question to knowledge points.
  Return ONLY valid JSON, no markdown, no explanation.
  Only use predefined knowledge node codes. Never create new nodes.
  If uncertain, map to the UNKNOWN node for the subject.

  Available knowledge nodes (use IDs only):
  {knowledge_nodes}

input_schema:
  question_text: string
  subject: string

output_schema:
  knowledge_nodes: list
  confidence: float

output_example: |
  {"knowledge_nodes": [{"id": 1, "code": "MATH-ALG"}, {"id": 3, "code": "MATH-FUNC"}], "confidence": 0.91}
