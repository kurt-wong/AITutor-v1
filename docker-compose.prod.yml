# ============================================================================
# AI Tutor — 生产环境 Docker Compose
# 目标平台: Synology DS3622xs+ (x86 Docker)
# 使用方式: docker compose -f docker-compose.prod.yml up -d
# ============================================================================

services:
  backend:
    image: aitutor-backend:v1.0.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitutor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-aitutor_prod_2026}@postgres:5432/ai_tutor
      - REDIS_URL=redis://redis:6379/0
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-aitutor_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-change_me_in_production}
      - MINIO_BUCKET=ai-tutor
      - LLM_GATEWAY_MODE=${LLM_GATEWAY_MODE:-live}
      - DEBUG=false
      - OCR_PROVIDER=paddleocr
      - OCR_MOCK_MODE=false
      - PADDLEOCR_USE_GPU=false
      - PADDLEOCR_LANG=ch
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=qwen3-embedding:4b
      - EMBEDDING_MOCK_MODE=false
      - EMBEDDING_DIMENSION=0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aitutor-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: aitutor-frontend:v1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aitutor-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aitutor-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aitutor-postgres
    restart: unless-stopped
    # Production: db port NOT exposed to host (only internal)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitutor_prod_2026}
      POSTGRES_DB: ai_tutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_tutor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aitutor-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: aitutor-redis
    restart: unless-stopped
    # Production: redis port NOT exposed to host (only internal)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aitutor-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: aitutor-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aitutor_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_in_production}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aitutor-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  aitutor-net:
    driver: bridge

volumes:
  pgdata:
    # NAS 上持久化: 映射到 /volume1/docker/aitutor/pgdata
  redisdata:
    # NAS 上持久化: 映射到 /volume1/docker/aitutor/redisdata
  miniodata:
    # NAS 上持久化: 映射到 /volume1/docker/aitutor/miniodata
