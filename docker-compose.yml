services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aitutor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/ai_tutor
      - REDIS_URL=redis://redis:6379/0
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=ai-tutor
      - LLM_GATEWAY_MODE=mock
      - DEBUG=true
      - OCR_PROVIDER=paddleocr
      - OCR_MOCK_MODE=false
      # SECURITY: PADDLEOCR_VL_TOKEN must be set in .env or shell environment.
      # Previous default was a real token — rotate at https://aistudio.baidu.com/account/accessToken
      - PADDLEOCR_VL_TOKEN=${PADDLEOCR_VL_TOKEN:?PADDLEOCR_VL_TOKEN is required. Set it in .env}
      - PADDLEOCR_VL_ENABLED=true
      - PADDLEOCR_VL_LAYOUT_MODE=api
      - PADDLEOCR_VL_API_TIMEOUT=300
      - PADDLEOCR_VL_MAX_RETRIES=2
      - PADDLEOCR_USE_GPU=false
      - PADDLEOCR_LANG=ch
      - SIMPLETEX_API_KEY=
      - SIMPLETEX_API_URL=https://server.simpletex.cn/api/latex_ocr
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=qwen3-embedding:4b
      - EMBEDDING_MOCK_MODE=true
      - EMBEDDING_DIMENSION=0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aitutor-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aitutor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aitutor-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aitutor-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ai_tutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_tutor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aitutor-net

  redis:
    image: redis:7-alpine
    container_name: aitutor-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aitutor-net

  minio:
    image: minio/minio:latest
    container_name: aitutor-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aitutor-net

networks:
  aitutor-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
